name: Build Material Packer APK v3.2

on:
  pull_request:
    branches: [main]
    paths:
      - 'apk-build-v32/**'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore build source
        run: |
          cat apk-build-v32/source.part* | base64 --decode > source.zip
          mkdir build-source
          unzip -q source.zip -d build-source

      - name: Create Android project
        run: |
          bash build-source/setup.sh android-project
          mkdir -p android-project/app/src/main/assets/www
          cp build-source/web/index.html android-project/app/src/main/assets/www/
          cp build-source/web/styles.css android-project/app/src/main/assets/www/
          cp build-source/web/app.js android-project/app/src/main/assets/www/
          cp -r build-source/web/examples android-project/app/src/main/assets/www/

      - name: Build debug APK
        run: gradle --no-daemon -p android-project assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release-apk
          cp android-project/app/build/outputs/apk/debug/app-debug.apk release-apk/material-packer-v3.2.apk
          sha256sum release-apk/material-packer-v3.2.apk > release-apk/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: material-packer-apk-v3-2
          path: release-apk/
          if-no-files-found: error
          retention-days: 7
