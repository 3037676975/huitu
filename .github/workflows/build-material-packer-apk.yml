name: Build Material Packer APK

on:
  push:
    branches: [main]
    paths:
      - 'apk-build/build-ready.txt'
  pull_request:
    branches: [main]
    paths:
      - 'apk-build/build-ready.txt'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          bash apk-build/setup.sh android-project
          cp apk-build/web/index.html android-project/app/src/main/assets/www/
          cp apk-build/web/styles.css android-project/app/src/main/assets/www/
          cp apk-build/web/app-*.js android-project/app/src/main/assets/www/

      - name: Build debug APK
        run: gradle --no-daemon -p android-project assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release-apk
          cp android-project/app/build/outputs/apk/debug/app-debug.apk release-apk/material-packer-v3.1.apk
          sha256sum release-apk/material-packer-v3.1.apk > release-apk/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: material-packer-apk-v3-1
          path: release-apk/
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK to repository
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-apk/material-packer-v3.1.apk release-apk/SHA256.txt
          git commit -m "build: publish material packer APK v3.1" || exit 0
          git push origin main
